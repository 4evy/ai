[workspace]
members = [
  "farstep/native/protocol",
  "farstep/native/desktop-runtime",
  "farstep/native/desktop",
  "farstep/native/service",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
ashpd = { version = "=0.13.13", default-features = false }
async-io = "=2.6.0"
async-trait = "=0.1.92"
axuielement = "=0.10.0"
backon = { version = "=1.6.0", default-features = false }
base64 = "=0.23.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", default-features = false }
command-fds = "=0.3.3"
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
derive_more = { version = "=2.1.1", default-features = false }
dirs = "=7.0.0"
dlopen2 = { version = "=0.9.0", default-features = false, features = [
  "derive",
  "wrapper",
] }
enigo = { version = "=0.6.1", default-features = false }
enumflags2 = "=0.7.12"
futures-util = "=0.3.34"
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.4"
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false }
objc2-core-graphics = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "=0.3.2", default-features = false }
png = "=0.18.1"
procfs = { version = "=0.18.0", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false }
reis = "=0.7.1"
rmcp = { version = "=3.5.1", default-features = false }
rustix = "=1.1.5"
schemars = "=1.2.3"
scopeguard = { version = "=1.2.0", default-features = false }
screencapturekit = "=11.0.0"
serde = "=1.0.229"
serde_json = "=1.0.154"
smithay-client-toolkit = { version = "=0.21.1", default-features = false }
tempfile = "=3.27.0"
tokio = "=1.53.3"
tokio-util = "=0.7.20"
uuid = "=1.28.0"
wayland-client = "=0.31.15"
wayland-protocols-misc = "=0.3.12"
wayland-protocols-wlr = "=0.3.12"
win-custody = "=0.1.1"
windows = "=0.62.2"
windows-service = "=0.8.1"
wl-clipboard-rs = "=0.9.4"
wl-proxy = { version = "=0.1.5", default-features = false }
xkbcommon = "=0.9.0"
zbus = { version = "=6.0.0", default-features = false }
zbus_systemd = "=0.26200.0"

[workspace.lints.rust]
# Native API modules are the only permitted unsafe boundary
unsafe_code = "deny"

[workspace.lints.clippy]
# Opt-in hazards only; leave the default lint groups to Clippy
allow_attributes_without_reason = "deny"
cast_ptr_alignment = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
panic = "deny"
ptr_as_ptr = "deny"
rc_mutex = "deny"
string_slice = "deny"
suspicious_operation_groupings = "deny"
todo = "deny"
transmute_ptr_to_ptr = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 3
debug = false
incremental = false
lto = "fat"
codegen-units = 1
strip = "symbols"
# Keep task panics isolated and allow cleanup guards to run
panic = "unwind"

[profile.dev]
opt-level = 0
lto = "off"
incremental = true
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Opt into full debug information with cargo build --profile debugging
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "full"
