name: Bun check
on:
  workflow_call:
    inputs:
      task:
        description: Repository check to run
        required: true
        type: string
      runner:
        description: GitHub-hosted runner
        default: ubuntu-26.04
        type: string
permissions: {}
jobs:
  check:
    name: ${{ inputs.task }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository's Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install architecture checker dependencies
        if: inputs.task == 'quality'
        run: bun install --cwd tools/scripts/dependencies --frozen-lockfile --ignore-scripts
      - name: Check lint and formatting
        if: inputs.task == 'quality'
        run: bun run check:biome
      - name: Check dependencies
        if: inputs.task == 'quality'
        run: bun run check:dependencies
      - name: Check import boundaries
        if: inputs.task == 'quality'
        run: bun run check:architecture
      - name: Check pinned Sky declarations
        if: inputs.task == 'pins'
        run: bun run check:sky
      - name: Check pinned OMP patches
        if: inputs.task == 'pins'
        run: bun run check:patches
      - name: Typecheck the root and workspaces
        if: inputs.task == 'typecheck'
        run: bun run typecheck
      - name: Build the root and workspaces
        if: inputs.task == 'build'
        run: bun run build
      - name: Run process tests
        if: inputs.task == 'test'
        run: bun run test
