name: Nix check
on:
  workflow_call:
    inputs:
      task:
        description: Nix check to run
        required: true
        type: string
      runner:
        description: GitHub-hosted runner
        default: ubuntu-26.04
        type: string
      system:
        description: Flake system matching the runner
        default: x86_64-linux
        type: string
permissions: {}
jobs:
  check:
    name: ${{ inputs.task }} (${{ inputs.system }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.task == 'packages' && 180 || 90 }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository's Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Cache Nix build outputs
        if: inputs.task == 'packages' || inputs.task == 'format'
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Run the selected check
        env:
          TASK: ${{ inputs.task }}
          NIX_SYSTEM: ${{ inputs.system }}
        run: bun --no-install .github/scripts/nix/nix.ts
