name: Nix packages
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Build and smoke-check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
          - runner: macos-26
            system: aarch64-darwin
    uses: $/.github/workflows/nix-check.yml
    permissions:
      contents: read
    with:
      task: packages
      runner: ${{ matrix.runner }}
      system: ${{ matrix.system }}
