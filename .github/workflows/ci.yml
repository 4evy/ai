name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bun:
    name: Bun ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [quality, pins, typecheck, build]
    uses: $/.github/workflows/bun-check.yml
    permissions:
      contents: read
    with:
      task: ${{ matrix.task }}
  tests:
    name: Process tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    uses: $/.github/workflows/bun-check.yml
    permissions:
      contents: read
    with:
      task: test
      runner: ${{ matrix.runner }}
  nix-checks:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [evaluate, tooling, format]
    uses: $/.github/workflows/nix-check.yml
    permissions:
      contents: read
    with:
      task: ${{ matrix.task }}
  native:
    name: ${{ matrix.task }} (${{ matrix.platform.system }})
    strategy:
      fail-fast: false
      matrix:
        task: [native-lint, native-tests]
        platform:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
          - runner: macos-26
            system: aarch64-darwin
    uses: $/.github/workflows/nix-check.yml
    permissions:
      contents: read
    with:
      task: ${{ matrix.task }}
      runner: ${{ matrix.platform.runner }}
      system: ${{ matrix.platform.system }}
  packages:
    name: Package ${{ matrix.package }} (${{ matrix.platform.system }})
    strategy:
      fail-fast: false
      matrix:
        package:
          - ai-javascript
          - ai-shared
          - farstep-modules
          - farstep-javascript
          - farstep-desktop
          - farstep-service
          - ai-configs
          - farstep
          - ghidra-mcp
        platform:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
          - runner: macos-26
            system: aarch64-darwin
        include:
          - package: farstep-extensions
            platform:
              runner: ubuntu-26.04
              system: x86_64-linux
          - package: farstep-kde-bridge
            platform:
              runner: ubuntu-26.04
              system: x86_64-linux
    uses: $/.github/workflows/nix-check.yml
    permissions:
      contents: read
    with:
      task: package
      package: ${{ matrix.package }}
      runner: ${{ matrix.platform.runner }}
      system: ${{ matrix.platform.system }}
  powershell:
    name: PowerShell (${{ matrix.shell }})
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 6) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
      - name: Check PowerShell formatting, syntax, and lint
        run: |
          $paths = @(git ls-files -- '*.ps1' '*.psm1' '*.psd1')
          if ($LASTEXITCODE -ne 0 -or $paths.Count -eq 0) { throw 'Cannot discover PowerShell sources' }
          & ./tools/scripts/powershell/powershell.ps1 -Check -Paths $paths
  windows-native:
    name: Windows native
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository's Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Read the declared minimum Rust version
        id: rust
        shell: bash
        run: |
          bun -e '
            const { workspace } = Bun.TOML.parse(await Bun.file("Cargo.toml").text());
            const version = workspace?.package?.["rust-version"];
            if (typeof version !== "string" || !/^\d+\.\d+(?:\.\d+)?$/.test(version))
              throw new Error("Invalid Cargo workspace rust-version");
            console.log("version=" + version);
          ' >> "$GITHUB_OUTPUT"
      - name: Install Rust and cache Cargo dependencies
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy
          build-warnings: warn
          cache-bin: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Lint Windows native code
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: Test and smoke-check Windows native executables
        run: bun --no-install .github/scripts/native/native.ts
