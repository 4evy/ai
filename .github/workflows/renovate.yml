name: Renovate
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out the runner configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: Install the repository's Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install workflow dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Renovate with the repository toolchain
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_CONFIG_FILE: .github/renovate-runner.mjs
          LOG_LEVEL: info
        run: bun .github/scripts/renovate/renovate.ts
